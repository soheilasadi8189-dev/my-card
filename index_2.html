<style>
*{box-sizing:border-box;font-family:Inter,sans-serif}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#05060a,#111827);color:#fff;overflow:hidden}
.bg:before,.bg:after{content:"";position:fixed;width:40vmax;height:40vmax;border-radius:50%;filter:blur(80px);opacity:.35;animation:f 10s ease-in-out infinite alternate}
.bg:before{background:#33ff00bb;left:-10%;top:-10%}.bg:after{background:#00ff0d;right:-10%;bottom:-10%}
@keyframes f{to{transform:translate(80px,-50px) scale(1.2)}}
.card{width:min(420px,92vw);padding:28px;border-radius:24px;background:rgba(0, 0, 0, 0.08);backdrop-filter:blur(20px);text-align:center;border:1px solid rgba(255,255,255,.15)}
img.avatar{width:110px;height:110px;border-radius:50%;border:3px solid #00ff22}
h1{margin:14px 0 4px}small{opacity:.7;letter-spacing:8px}
a{display:block;margin:12px 0;padding:14px;border-radius:14px;color:#fff;text-decoration:none;font-weight:700;background:rgba(255,255,255,.08)}
.top{display:flex;justify-content:flex-end}.toggle{cursor:pointer;padding:8px 12px;border-radius:10px;border:none}
.light{background:#f5f5f5;color:#111}.light .card{background:rgba(255, 255, 255, 0.8)}.light a{background:#e5e7eb;color:#111}
#qr img{margin-top:16px;border-radius:12px;background:#fff;padding:8px;width:130px}
</style></head>
